<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تخمين الرقم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 1rem;
        }

        p {
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            border: 2px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #fff;
            text-align: center;
            margin-bottom: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #0284c7;
            color: #fff;
        }

        .message {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 30px;
        }

        .attempts {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #64748b;
        }

        .developer {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #334155;
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>خَمّن الرقم 🎯</h1>
        <p>اخترنا رقماً بين 1 و 100، هل يمكنك معرفته؟</p>

        <input type="number" id="guessInput" placeholder="أدخل رقمك هنا" min="1" max="100">
        <button id="btn" onclick="checkGuess()">تخمين</button>

        <div class="message" id="message"></div>
        <div class="attempts" id="attempts">عدد المحاولات: 0</div>

        <div class="developer">من تطوير المطور حسن خطاب
        </div>
    </div>

    <script>
        let randomNumber = Math.floor(Math.random() * 100) + 1;
        let attemptsCount = 0;
        let gameOver = false;

        function checkGuess() {
            if (gameOver) {
                resetGame();
                return;
            }

            const input = document.getElementById('guessInput');
            const message = document.getElementById('message');
            const attempts = document.getElementById('attempts');
            const userGuess = parseInt(input.value);

            if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
                message.style.color = '#f87171';
                message.textContent = 'الرجاء إدخال رقم صحيح بين 1 و 100!';
                return;
            }

            attemptsCount++;
            attempts.textContent = `عدد المحاولات: ${attemptsCount}`;

            if (userGuess === randomNumber) {
                message.style.color = '#4ade80';
                message.textContent = `🎉 مبروك! إجابة صحيحة، الرقم هو ${randomNumber}`;
                document.getElementById('btn').textContent = 'لعب مرة أخرى';
                gameOver = true;
            } else if (userGuess < randomNumber) {
                message.style.color = '#fbbf24';
                message.textContent = '📉 الرقم المطلوب أكبر من ذلك!';
            } else {
                message.style.color = '#fbbf24';
                message.textContent = '📈 الرقم المطلوب أصغر من ذلك!';
            }

            input.value = '';
            input.focus();
        }

        function resetGame() {
            randomNumber = Math.floor(Math.random() * 100) + 1;
            attemptsCount = 0;
            gameOver = false;
            document.getElementById('message').textContent = '';
            document.getElementById('attempts').textContent = 'عدد المحاولات: 0';
            document.getElementById('btn').textContent = 'تخمين';
            document.getElementById('guessInput').value = '';
        }
    </script>
</body>
</html>
